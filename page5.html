<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.22),transparent 28%),
    linear-gradient(135deg,#f7c9d6 0%,#ef9eb4 48%,#e99aaa 100%);
  font-family:Georgia,"Times New Roman",serif;
}
.scene{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.glow{
  position:absolute;
  width:min(55vw,720px);
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  filter:blur(55px);
  animation:glow 5s ease-in-out infinite;
}
.message{
  position:relative;
  z-index:2;
  color:#632d42;
  font-size:clamp(4rem,10vw,10rem);
  font-weight:700;
  letter-spacing:.035em;
  text-align:center;
  white-space:nowrap;
  text-shadow:0 8px 35px rgba(100,40,65,.16);
  opacity:0;
  transform:translateY(48vh) scale(.88);
  animation:
    arrive 6s cubic-bezier(.16,1,.3,1) forwards,
    breathe 4.5s ease-in-out 6s infinite;
}
.heart{
  display:inline-block;
  margin-left:.08em;
  color:#7a304d;
  animation:heart 2.8s ease-in-out 6s infinite;
}
.sparkle{
  position:absolute;
  color:rgba(255,255,255,.75);
  font-size:clamp(1.2rem,2vw,2rem);
  animation:float 6s ease-in-out infinite;
}
.s1{left:17%;top:22%;animation-delay:1s}
.s2{right:19%;top:29%;animation-delay:2.5s}
.s3{left:24%;bottom:20%;animation-delay:3.5s}
.s4{right:24%;bottom:18%;animation-delay:4.2s}

@keyframes arrive{
  0%{opacity:0;transform:translateY(48vh) scale(.88);filter:blur(8px)}
  15%{opacity:1}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes breathe{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(0) scale(1.025)}
}
@keyframes heart{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}
@keyframes glow{
  0%,100%{transform:scale(.94);opacity:.55}
  50%{transform:scale(1.08);opacity:.9}
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0);opacity:.35}
  50%{transform:translateY(-16px) rotate(8deg);opacity:.9}
}
@media(max-width:700px){
  .message{font-size:clamp(3rem,14vw,6rem);white-space:normal}
}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div class="sparkle s1">✦</div>
  <div class="sparkle s2">♡</div>
  <div class="sparkle s3">✧</div>
  <div class="sparkle s4">♡</div>
  <div class="message">I LOVE YOU <span class="heart">❤️</span></div>
</div>
</body>
</html>
